
<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Merci - B.A TRANS'SERVICES</title>

    <meta name="description"
        content="Confirmation de l'envoi de votre message à B.A TRANS'SERVICES.">

    <!-- Bootstrap -->
    <link rel="stylesheet"
        href="bootstrap-5.3.8-dist/css/bootstrap.min.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            background: #f5f5f5;
            min-height: 100vh;
        }

        .card {
            border: none;
            border-radius: 20px;
            max-width: 600px;
        }

        .success-icon {
            font-size: 4rem;
            color: #198754;
        }

        .btn-warning {
            background-color: #ffc107;
            border: none;
            padding: 12px 30px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-warning:hover {
            background-color: #e0a800;
            transform: translateY(-2px);
        }

    </style>

</head>

<body>

    <div class="container min-vh-100 d-flex justify-content-center align-items-center">

        <div class="card shadow-lg p-5 text-center">

            <div class="success-icon mb-3">

                <i class="bi bi-check-circle-fill"></i>

            </div>

            <h1 class="text-success">

                Merci !

            </h1>

            <p class="lead mt-3">

                Votre message a bien été envoyé.

            </p>

            <p class="text-muted">

                Notre équipe reviendra vers vous dans les meilleurs délais.

            </p>

            <a href="index.html"
                class="btn btn-warning mt-3">

                <i class="bi bi-arrow-left me-2"></i>

                Retour au site

            </a>

        </div>

    </div>

</body>

</html>
